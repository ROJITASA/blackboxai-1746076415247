<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema Punto de Venta</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <header class="bg-blue-600 text-white p-4 shadow-md">
    <h1 class="text-2xl font-bold">Sistema Punto de Venta</h1>
  </header>

  <main class="flex-grow p-6">
    <section id="login-section" class="max-w-md mx-auto bg-white p-6 rounded shadow-md">
      <h2 class="text-xl font-semibold mb-4">Iniciar Sesión</h2>
      <form id="login-form" class="space-y-4">
        <div>
          <label for="username" class="block mb-1 font-medium">Usuario</label>
          <input type="text" id="username" name="username" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label for="password" class="block mb-1 font-medium">Contraseña</label>
          <input type="password" id="password" name="password" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded transition">Entrar</button>
      </form>
    </section>

    <section id="app-section" class="hidden max-w-7xl mx-auto">
      <!-- Main app content will be dynamically loaded here after login -->
      <p class="text-center text-gray-500">Cargando aplicación...</p>
    </section>
  </main>

  <footer class="bg-gray-200 text-center p-4 text-sm text-gray-600">
    &copy; 2024 Sistema Punto de Venta
  </footer>

  <script src="renderer.js"></script>
</body>
</html>
